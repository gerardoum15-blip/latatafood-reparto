<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Aula Virtual</title>
<style>
/* Una columna para celular; en pantallas anchas se centra a 760px. Barra inferior de navegación. */
:root{
  --bg:#f4f6f9; --surface:#fff; --fg:#17202e; --muted:#5b6678; --line:#dfe4ec;
  --accent:#1f5fae; --accent-ink:#fff; --accent-soft:#e6eefa;
  --ok:#17824f; --ok-soft:#e1f4ea; --warn:#a86200; --warn-soft:#fdf0dc; --bad:#c2352f; --bad-soft:#fbe6e5;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141c; --surface:#18202b; --fg:#e7ebf2; --muted:#9aa6b8; --line:#2a3443;
  --accent:#6ea3ec; --accent-ink:#0f141c; --accent-soft:#1c2c45;
  --ok:#4cc68a; --ok-soft:#163327; --warn:#f0a945; --warn-soft:#3a2a12; --bad:#ff7b72; --bad-soft:#3d1c1c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 96px max(16px,env(safe-area-inset-right))}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0}
h3{font-size:1rem;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.top .grow{flex:1;min-width:0}
.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:20px;flex:none;color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.list{display:grid;gap:10px;margin:0 0 16px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;color:var(--fg);font:inherit}
button.item{cursor:pointer}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;overflow-wrap:anywhere}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none;font-size:15px}
.btn{font:600 15px var(--font);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 16px;min-height:46px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.55}
.btn.block{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:grid;gap:5px;font-weight:600;font-size:.92rem}
input,select,textarea{font:16px var(--font);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:160px;resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.tabs button{flex:none;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--font);padding:8px 14px;min-height:38px}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 16px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
.sect{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));z-index:20}
.nav button{flex:1;max-width:160px;border:0;background:none;color:var(--muted);font:600 12px var(--font);display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current=true]{color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-size:.78rem;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:50;max-width:90vw;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:40;padding:16px}
.modal .card{width:min(100%,520px);max-height:85vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom)}
@media(min-width:620px){.modal{place-items:center}}
.imp{background:var(--warn);color:#fff;padding:8px 16px;text-align:center;font-weight:600;font-size:.9rem}
.imp button{background:#fff;color:var(--warn);border:0;border-radius:8px;padding:4px 10px;font-weight:700;margin-left:6px}
.answer{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:10px;padding:12px;border:1px solid var(--line)}
.files{display:grid;gap:6px}
.files a{color:var(--accent);overflow-wrap:anywhere}
.q{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px}
.q label.opt{display:flex;gap:10px;align-items:center;font-weight:400}
.q label.opt input{width:22px;min-height:22px;height:22px}
.spinner{display:grid;place-items:center;padding:40px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.chart{width:100%;height:auto;display:block}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="imp" class="imp" hidden></div>
<main class="wrap" id="app"><div class="spinner">Cargando…</div></main>
<nav class="nav" id="nav" hidden></nav>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>
<script>
/* ======================= Base ======================= */
const S = { token: null, user: null, cfg: { nombre: 'Aula Virtual', notaMaxima: 20 }, stack: [], tab: {}, adminToken: null, adminUser: null };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem('av:' + k); } catch (e) { return null; } }, set(k, v) { try { v === null ? localStorage.removeItem('av:' + k) : localStorage.setItem('av:' + k, v); } catch (e) {} } };
const fFecha = ms => ms ? new Date(ms).toLocaleString('es-PE', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const fDia = ms => ms ? new Date(ms).toLocaleDateString('es-PE', { day: 'numeric', month: 'short' }) : '';
const fTam = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
function hace(ms) {
  if (!ms) return 'Nunca entró';
  const m = (Date.now() - ms) / 60000;
  if (m < 2) return 'Conectado ahora'; if (m < 60) return 'Hace ' + Math.round(m) + ' min';
  const h = m / 60; if (h < 24) return 'Hace ' + Math.round(h) + ' h';
  const d = h / 24; return d < 2 ? 'Ayer' : 'Hace ' + Math.round(d) + ' días';
}
const fMin = m => m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
const TIPOS = { foro: 'Comentario privado', archivo: 'Subir archivos', formulario: 'Formulario', parcial: 'Examen parcial', final: 'Examen final' };
const ICONOS = { foro: '✎', archivo: '⇪', formulario: '☰', parcial: 'P', final: 'F' };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }
function call(accion, datos) {
  return new Promise((ok, ko) => {
    if (!window.google || !google.script) { ko(new Error('Abre esta app desde su enlace de Google.')); return; }
    google.script.run.withSuccessHandler(r => {
      if (r && r.ok) ok(r.data);
      else if (r && r.error === 'SESION') { salirLocal(); toast('Tu sesión terminó. Vuelve a entrar.'); ko(new Error('SESION')); }
      else ko(new Error(r ? r.error : 'Error'));
    }).withFailureHandler(e => ko(new Error(e && e.message ? e.message : 'Sin conexión. Revisa tu internet e inténtalo otra vez.'))).api(accion, S.token, datos || {});
  });
}
async function act(btn, fn) {
  const b = btn && btn.tagName ? btn : null, txt = b ? b.textContent : '';
  if (b) { b.disabled = true; b.textContent = 'Un momento…'; }
  try { return await fn(); } catch (e) { if (e.message !== 'SESION') toast(e.message); return undefined; } finally { if (b && b.isConnected) { b.disabled = false; b.textContent = txt; } }
}
function preguntar(msg, si, no) {
  return new Promise(res => {
    const m = $('#modal'); m.hidden = false;
    m.innerHTML = `<div class="card" role="dialog" aria-modal="true"><p>${msg}</p><div class="row"><button class="btn primary" id="mSi">${esc(si || 'Sí')}</button><button class="btn" id="mNo">${esc(no || 'Cancelar')}</button></div></div>`;
    $('#mSi').onclick = () => { m.hidden = true; res(true); }; $('#mNo').onclick = () => { m.hidden = true; res(false); };
  });
}
function modal(html) { const m = $('#modal'); m.hidden = false; m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}</div>`; m.onclick = e => { if (e.target === m) cerrarModal(); }; return m; }
function cerrarModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }

/* ======================= Navegación ======================= */
const VISTAS = {};
function ir(vista, params, reemplazar) { if (reemplazar) S.stack.pop(); S.stack.push({ vista, params: params || {} }); pintar(); window.scrollTo(0, 0); }
function atras() { if (S.stack.length > 1) { S.stack.pop(); pintar(); window.scrollTo(0, 0); } }
function raiz(vista) { S.stack = [{ vista, params: {} }]; pintar(); window.scrollTo(0, 0); }
async function pintar() {
  const cur = S.stack[S.stack.length - 1]; if (!cur) return;
  pintarNav(cur.vista);
  const app = $('#app');
  try { await VISTAS[cur.vista](app, cur.params); } catch (e) { if (e.message !== 'SESION') app.innerHTML = cabecera('Algo salió mal', true) + `<div class="note bad">${esc(e.message)}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="pintar()">Reintentar</button></div>`; }
}
function cabecera(titulo, conAtras, sub) {
  return `<div class="top">${conAtras && S.stack.length > 1 ? '<button class="back" onclick="atras()" aria-label="Volver">‹</button>' : ''}<div class="grow"><h1>${esc(titulo)}</h1>${sub ? `<p class="muted small">${sub}</p>` : ''}</div></div>`;
}
const SVG = {
  casa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  gente: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.6.2 4.6 1.9 5.3 5.4"/></svg>',
  notas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  yo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>'
};
function pintarNav(vista) {
  const nav = $('#nav');
  if (!S.user || ['login', 'registro', 'forzarClave'].indexOf(vista) >= 0) { nav.hidden = true; return; }
  const items = S.user.rol === 'profesor'
    ? [['pInicio', 'Inicio', SVG.casa], ['pEstudiantes', 'Estudiantes', SVG.gente], ['pComparativo', 'Notas', SVG.notas], ['perfil', 'Mi cuenta', SVG.yo]]
    : [['eInicio', 'Mis aulas', SVG.casa], ['eNotas', 'Mis notas', SVG.notas], ['perfil', 'Mi cuenta', SVG.yo]];
  const raizActual = S.stack[0] && S.stack[0].vista;
  nav.hidden = false;
  nav.innerHTML = items.map(([v, l, i]) => `<button onclick="raiz('${v}')" aria-current="${raizActual === v}">${i}<span>${l}</span></button>`).join('');
}

/* ======================= Sesión ======================= */
function entrar(r) {
  S.token = r.token; S.user = r.usuario; store.set('token', r.token);
  pintarImp();
  if (S.user.debeCambiarClave && !S.user.imp) return raiz('forzarClave');
  raiz(S.user.rol === 'profesor' ? 'pInicio' : 'eInicio');
}
function salirLocal() { S.token = null; S.user = null; store.set('token', null); S.adminToken = null; pintarImp(); raiz('login'); }
function pintarImp() {
  const b = $('#imp');
  if (S.adminToken && S.user) { b.hidden = false; b.innerHTML = `Estás viendo la cuenta de ${esc(S.user.nombres)} ${esc(S.user.apellidos)} <button onclick="volverAdmin()">Volver a mi cuenta</button>`; }
  else b.hidden = true;
}
function volverAdmin() { S.token = S.adminToken; S.user = S.adminUser; S.adminToken = null; store.set('token', S.token); pintarImp(); raiz('pEstudiantes'); }
let pingT = 0, ultimoPing = Date.now();
function iniciarPing() {
  clearInterval(pingT);
  pingT = setInterval(() => { if (document.visibilityState === 'visible' && S.token && !S.adminToken) { const min = Math.round((Date.now() - ultimoPing) / 60000); ultimoPing = Date.now(); call('ping', { minutos: min }).catch(() => {}); } else ultimoPing = Date.now(); }, 120000);
}

VISTAS.login = async app => {
  app.innerHTML = `<div style="max-width:420px;margin:8vh auto 0;display:grid;gap:16px">
    <div><h1>${esc(S.cfg.nombre)}</h1><p class="muted">Entra con tu DNI o tu correo.</p></div>
    <form class="card" id="fLogin" autocomplete="on">
      <label class="f">DNI o correo<input id="lUser" name="username" autocomplete="username" inputmode="text" required></label>
      <label class="f">Contraseña<input id="lClave" name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary block" type="submit">Entrar</button>
    </form>
    <div class="card"><b>¿Es tu primera vez?</b><p class="muted small">Crea tu cuenta con tu DNI, tus datos y el código de aula que te dio tu profesor.</p><button class="btn block" onclick="ir('registro')">Crear mi cuenta</button></div>
    <p class="muted small">¿Olvidaste tu contraseña? Pídele a tu profesor que la restablezca.</p>
  </div>`;
  $('#fLogin').onsubmit = e => { e.preventDefault(); act(e.submitter, async () => entrar(await call('login', { usuario: $('#lUser').value, clave: $('#lClave').value }))); };
};
VISTAS.registro = async app => {
  app.innerHTML = cabecera('Crear mi cuenta', true, 'Solo la primera vez.') + `<form class="card" id="fReg">
    <label class="f">DNI<input id="rDni" inputmode="numeric" maxlength="12" autocomplete="off" required></label>
    <label class="f">Nombres<input id="rNom" autocomplete="given-name" required></label>
    <label class="f">Apellidos completos<input id="rApe" autocomplete="family-name" required></label>
    <label class="f">Celular<input id="rCel" type="tel" inputmode="tel" autocomplete="tel" required></label>
    <label class="f">Correo<input id="rCor" type="email" autocomplete="email" required><span class="muted small">También podrás entrar con tu correo en lugar del DNI.</span></label>
    <label class="f">Contraseña<input id="rC1" type="password" autocomplete="new-password" minlength="6" required></label>
    <label class="f">Repite la contraseña<input id="rC2" type="password" autocomplete="new-password" minlength="6" required></label>
    <label class="f">Código del aula<input id="rCod" autocomplete="off" style="text-transform:uppercase" placeholder="Ej.: K7M2QX"><span class="muted small">Te lo da tu profesor. Si no lo tienes, puedes agregarlo después.</span></label>
    <p class="muted small">Tus datos solo los ve tu profesor y se usan para tus clases.</p>
    <button class="btn primary block" type="submit">Crear cuenta</button></form>`;
  $('#fReg').onsubmit = e => {
    e.preventDefault();
    if ($('#rC1').value !== $('#rC2').value) return toast('Las contraseñas no coinciden.');
    act(e.submitter, async () => entrar(await call('registrar', { dni: $('#rDni').value, nombres: $('#rNom').value, apellidos: $('#rApe').value, celular: $('#rCel').value, correo: $('#rCor').value, clave: $('#rC1').value, codigo: $('#rCod').value })));
  };
};
VISTAS.forzarClave = async app => {
  app.innerHTML = `<div style="max-width:420px;margin:6vh auto 0;display:grid;gap:14px"><div><h1>Crea tu nueva contraseña</h1><p class="muted">Por seguridad, cambia la contraseña que te dieron.</p></div>${formClave(true)}</div>`;
  bindClave(() => raiz(S.user.rol === 'profesor' ? 'pInicio' : 'eInicio'));
};
function formClave(forzada) {
  return `<form class="card" id="fClave"><label class="f">Contraseña actual<input id="cA" type="password" autocomplete="current-password" required></label>
    <label class="f">Nueva contraseña<input id="cN" type="password" autocomplete="new-password" minlength="6" required></label>
    <label class="f">Repite la nueva<input id="cN2" type="password" autocomplete="new-password" minlength="6" required></label>
    <button class="btn primary" type="submit">${forzada ? 'Guardar y continuar' : 'Cambiar contraseña'}</button></form>`;
}
function bindClave(despues) {
  $('#fClave').onsubmit = e => {
    e.preventDefault(); if ($('#cN').value !== $('#cN2').value) return toast('Las contraseñas nuevas no coinciden.');
    act(e.submitter, async () => { await call('cambiarClave', { actual: $('#cA').value, nueva: $('#cN').value }); S.user.debeCambiarClave = false; toast('Contraseña cambiada'); despues && despues(); });
  };
}
VISTAS.perfil = async app => {
  const u = S.user;
  app.innerHTML = cabecera('Mi cuenta') + `<div class="card"><b>${esc(u.nombres)} ${esc(u.apellidos)}</b><p class="muted small">DNI ${esc(u.dni)} · ${u.rol === 'profesor' ? 'Profesor' : 'Estudiante'}</p>
    <form class="row" id="fPerfil" style="display:grid;gap:10px"><label class="f">Celular<input id="pCel" type="tel" value="${esc(u.celular)}"></label><label class="f">Correo<input id="pCor" type="email" value="${esc(u.correo)}"></label><button class="btn" type="submit">Guardar datos</button></form></div>
    <div class="sect"><h2>Cambiar contraseña</h2></div>${formClave(false)}
    ${u.rol === 'profesor' ? '<div class="sect"><h2>Detector de IA</h2></div><div class="card" id="cIA"><div class="spinner">…</div></div>' : ''}
    <div class="row" style="margin-top:18px"><button class="btn danger" id="bSalir">Cerrar sesión</button></div>`;
  $('#fPerfil').onsubmit = e => { e.preventDefault(); act(e.submitter, async () => { S.user = Object.assign(S.user, await call('actualizarPerfil', { celular: $('#pCel').value, correo: $('#pCor').value })); toast('Datos guardados'); }); };
  bindClave();
  $('#bSalir').onclick = () => act(null, async () => { await call('salir').catch(() => {}); salirLocal(); });
  if (u.rol === 'profesor') pintarIA();
};
async function pintarIA() {
  const p = await call('panel'), c = $('#cIA'); if (!c) return;
  c.innerHTML = `<p>${p.iaActiva ? '<span class="pill ok">Activo</span> Las respuestas se revisan también con Claude.' : '<span class="pill info">Básico</span> Ahora se usan solo indicios locales: texto pegado, velocidad al escribir y frases típicas.'}</p>

/* ======================= Archivos ======================= */
function aBase64(blob) { return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = ko; r.readAsDataURL(blob); }); }
async function subirArchivo(file, meta, alAvanzar) {
  if (!file.size) throw new Error('El archivo «' + file.name + '» está vacío.');
  const ini = await call('subirInicio', Object.assign({}, meta, { nombre: file.name, mime: file.type || 'application/octet-stream', tamano: file.size }));
  const PARTE = 4 * 1024 * 1024;
  for (let off = 0; off < file.size; off += PARTE) {
    const b64 = await aBase64(file.slice(off, off + PARTE));
    let r, intentos = 0;
    while (true) { try { r = await call('subirParte', { subidaId: ini.subidaId, b64, inicio: off, total: file.size }); break; } catch (e) { if (++intentos >= 3 || e.message === 'SESION') throw e; await new Promise(z => setTimeout(z, 1500 * intentos)); } }
    alAvanzar && alAvanzar(Math.min(1, (off + PARTE) / file.size));
    if (r.listo) return { id: r.id, nombre: file.name, mime: file.type, tamano: file.size };
  }
  throw new Error('La subida no terminó. Inténtalo otra vez.');
}
async function subirVarios(files, meta, cont) {
  const out = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    cont.innerHTML = `<p class="small">Subiendo ${i + 1} de ${files.length}: ${esc(f.name)} (${fTam(f.size)})</p><div class="prog"><i style="width:0%"></i></div>`;
    out.push(await subirArchivo(f, meta, p => { const b = cont.querySelector('.prog i'); if (b) b.style.width = Math.round(p * 100) + '%'; }));
  }
  cont.innerHTML = '';
  return out;
}
function descargarB64(nombre, b64, mime) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u8], { type: mime || 'application/octet-stream' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return url;
}

/* ======================= Detector de pegado ======================= */
function vigilar(ta, metricas) {
  let ultimo = 0;
  const tick = () => { const n = Date.now(); if (ultimo && n - ultimo < 30000) metricas.ms += n - ultimo; ultimo = n; };
  ta.addEventListener('paste', e => { const t = (e.clipboardData || window.clipboardData); const s = t ? t.getData('text') : ''; metricas.pegado += s.length; metricas.pegados++; tick(); });
  ta.addEventListener('drop', e => { const s = e.dataTransfer ? e.dataTransfer.getData('text') : ''; metricas.pegado += s.length; metricas.pegados++; });
  ta.addEventListener('beforeinput', e => { if (e.inputType === 'insertText' || e.inputType === 'insertCompositionText') metricas.tecleado += (e.data || '').length; if (e.inputType && e.inputType.indexOf('delete') === 0) metricas.borrados++; tick(); });
}

function grafico(items, max) {
  const pts = items.filter(i => i.nota !== null && i.nota !== undefined).map(i => i.nota / i.notaMaxima * max);
  if (pts.length < 2) return '';
  const W = 320, H = 120, px = i => 20 + i * (W - 40) / (pts.length - 1), py = v => H - 18 - v / max * (H - 34);
  const aprob = max * 0.55;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de tus notas"><line x1="20" x2="${W - 20}" y1="${py(aprob)}" y2="${py(aprob)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${W - 20}" y="${py(aprob) - 4}" text-anchor="end" font-size="10" fill="var(--muted)">aprobado ${Math.round(aprob * 10) / 10}</text>
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((v, i) => px(i) + ',' + py(v)).join(' ')}"/>${pts.map((v, i) => `<circle cx="${px(i)}" cy="${py(v)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${v >= aprob ? 'var(--accent)' : 'var(--bad)'}"/>`).join('')}
    <text x="${px(pts.length - 1)}" y="${py(pts[pts.length - 1]) - 9}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fg)">${Math.round(pts[pts.length - 1] * 10) / 10}</text></svg>`;
}

    ${grafico(n.items, max)}
    <div class="tbl"><table><thead><tr><th>Actividad</th><th class="num">Nota</th></tr></thead><tbody>${n.items.map(i => `<tr><td style="white-space:normal">${esc(i.titulo)}<div class="muted small">${TIPOS[i.tipo]}${i.peso !== 1 ? ' · peso ' + i.peso : ''}${i.comentario ? ' · «' + esc(i.comentario) + '»' : ''}</div></td><td class="num">${i.nota === null || i.nota === undefined ? '<span class="muted">—</span>' : `<b>${i.nota}</b>/${i.notaMaxima}`}</td></tr>`).join('')}</tbody></table></div></div>`;
}

  };
  $('#bEditar').onclick = () => {
    modal(`<h2>Editar datos</h2><form id="fEd" style="display:grid;gap:10px"><label class="f">DNI<input id="edDni" value="${esc(d.dni)}"></label><label class="f">Nombres<input id="edNom" value="${esc(d.nombres)}"></label><label class="f">Apellidos<input id="edApe" value="${esc(d.apellidos)}"></label><label class="f">Celular<input id="edCel" value="${esc(d.celular)}"></label><label class="f">Correo<input id="edCor" value="${esc(d.correo)}"></label><div class="row"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" onclick="cerrarModal()">Cancelar</button></div></form>`);
    $('#fEd').onsubmit = e => { e.preventDefault(); act(e.submitter, async () => { await call('editarEstudiante', { id: d.id, dni: $('#edDni').value, nombres: $('#edNom').value, apellidos: $('#edApe').value, celular: $('#edCel').value, correo: $('#edCor').value }); cerrarModal(); pintar(); }); };
  };
  $('#bComo').onclick = e => act(e.target, async () => { const res = await call('entrarComo', { id: d.id }); S.adminToken = S.token; S.adminUser = S.user; S.token = res.token; S.user = res.usuario; pintarImp(); raiz('eInicio'); });
  $('#bEstado').onclick = async e => { const des = d.estado !== 'bloqueado'; if (!des || await preguntar('¿Desactivar la cuenta? No podrá entrar hasta que la reactives.', 'Desactivar')) act(e.target, async () => { await call('estadoCuenta', { id: d.id, estado: des ? 'bloqueado' : 'activo' }); pintar(); }); };
};
VISTAS.pComparativo = async app => {
  app.innerHTML = cabecera('Notas y comparativos') + '<div class="spinner">Calculando…</div>';
  const c = await call('comparativo'), max = S.cfg.notaMaxima;
  const todas = c.flatMap(s => s.aulas.filter(a => a.promedio !== null));
  const mejor = todas.slice().sort((a, b) => b.promedio - a.promedio)[0];
  app.innerHTML = cabecera('Notas y comparativos', false, 'Promedios por sede y aula, sobre ' + max) +
    `<div class="row" style="margin-bottom:14px"><button class="btn primary" onclick="exportar({},this)">Descargar Excel de todo</button></div>
    ${mejor ? `<div class="note" style="margin-bottom:14px">Mejor promedio: <b>${esc(mejor.aula)}</b> con ${mejor.promedio}.</div>` : ''}
    ${c.map(s => `<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${esc(s.sede)}</b>${s.aulas.length ? `<button class="btn small" onclick="exportar({sedeId:'${s.sedeId}'},this)">Excel de la sede</button>` : ''}</div>
      ${s.aulas.map(a => `<button class="item" onclick="S.tab['${a.id}']='notas';ir('aula',{id:'${a.id}'})" style="display:grid;gap:6px"><span class="row" style="justify-content:space-between"><b>${esc(a.aula)}</b><span class="small"><b>${a.promedio === null ? '—' : a.promedio}</b></span></span>
        <span class="prog" aria-hidden="true"><i style="width:${a.promedio === null ? 0 : a.promedio / max * 100}%;background:${a.promedio !== null && a.promedio < max * 0.55 ? 'var(--bad)' : 'var(--accent)'}"></i></span>
        <span class="muted small">${a.estudiantes} estudiantes · ${a.aprobados} aprobados · ${a.desaprobados} desaprobados${a.entregas !== null ? ' · entregan ' + a.entregas + '%' : ''}</span></button>`).join('') || '<p class="muted small">Sin aulas.</p>'}</div>`).join('') || '<div class="empty">Aún no hay sedes.</div>'}`;
};

/* ======================= Arranque ======================= */
(async function iniciar() {
  try { S.cfg = await call('config'); } catch (e) {}
  document.title = S.cfg.nombre;
  const t = store.get('token');
  if (t) { S.token = t; try { S.user = await call('yo'); pintarImp(); iniciarPing(); return raiz(S.user.debeCambiarClave ? 'forzarClave' : S.user.rol === 'profesor' ? 'pInicio' : 'eInicio'); } catch (e) { S.token = null; } }
  raiz('login');
})();
const _entrar = entrar; entrar = r => { _entrar(r); iniciarPing(); };
</script>
