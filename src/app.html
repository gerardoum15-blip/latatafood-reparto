:root[data-theme="dark"]{

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:4px}
.ph{position:relative;padding:0;border:0;border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--line);min-height:0}

.ph.del img{opacity:.35}

.delbtn{background:var(--del);color:#fff;border-color:var(--del)}

.quick{display:flex;flex-wrap:wrap;gap:6px}

<div class="wrap">

  <div class="tabs" role="tablist" id="tabs"></div>

</div>
<div class="bar" id="bar" hidden></div>

async function offerFile(name, blob) {

  }

  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); return true; } catch (e) { if (e.name === 'AbortError') return false; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); return true;

function exportPlan() {
  const list = S.photos.filter(p => !(S.exclDel && p.del)).sort((a, b) => a.date - b.date), used = new Set();
  const by = S.exportBy;
  const items = list.map(p => {
    const month = `${monthKey(p.date)} ${monthLabel(p.date)}`;
    const raw = by === 'album' ? p.album : by === 'tipo' ? (p.cat || 'Sin clasificar') : by === 'evento' ? (events[p.event] && events[p.event].photos.length >= 3 ? eventName(p.event) : 'Sueltas') : by === 'lugar' ? placeName(p.place) : null;
    const folder = (p.video && by === 'tipo' && !p.cat ? 'Videos' : (raw || month)).replace(/[\\/:*?"<>|]/g, '-');
    let n = p.name.replace(/[\\/:*?"<>|]/g, '-'), path = folder + '/' + n, k = 2;
    while (used.has(path.toLowerCase())) { path = folder + '/' + n.replace(/(\.[^.]*)?$/, m => '-' + k + m); k++; }
    used.add(path.toLowerCase()); return { p, path };
  });
  // por partes: el navegador arma cada .zip en memoria, así que cada parte tiene un tamaño seguro
  const LIMIT = /iPhone|iPad|iPod/.test(navigator.userAgent) ? 700e6 : 1.8e9, parts = []; let cur = [], size = 0;
  items.forEach(it => { if (cur.length && size + it.p.size > LIMIT) { parts.push(cur); cur = []; size = 0; } cur.push(it); size += it.p.size; });
  if (cur.length) parts.push(cur);
  return parts;
}

  const parts = S.expParts, total = parts.reduce((n, l) => n + l.length, 0);
  prog.innerHTML = `${total} archivos (${fmtBig(parts.reduce((s, l) => s + l.reduce((t, it) => t + it.p.size, 0), 0))})${parts.length > 1 ? ` en <b>${parts.length} partes</b>, para que el teléfono no se quede sin memoria. Guarda cada parte; al descomprimirlas en la misma carpeta se juntan solas.` : '.'}
    <div class="row" style="margin-top:8px">${parts.map((l, i) => `<button data-part="${i}" class="${S.expDone.has(i) ? '' : 'primary'}">${S.expDone.has(i) ? '✓ ' : ''}Guardar parte ${i + 1}${parts.length > 1 ? ' de ' + parts.length : ''} (${fmtBig(l.reduce((t, it) => t + it.p.size, 0))})</button>`).join('')}</div><div id="partProg"></div>`;
}
async function savePart(i) {
  const part = S.expParts && S.expParts[i]; if (!part) return;
  const zip = new JSZip(); part.forEach(({ p, path }) => zip.file(path, p.file, { date: p.date, binary: true }));
  const pp = $('#partProg');
  try {
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE', streamFiles: true }, m => { if (pp) pp.textContent = `Preparando parte ${i + 1}… ${Math.round(m.percent)}%`; });
    const name = S.expParts.length > 1 ? `Fotos ordenadas - parte ${i + 1} de ${S.expParts.length}.zip` : 'Fotos ordenadas.zip';
    if (pp) pp.textContent = '';
    if (await offerFile(name, blob)) { S.expDone.add(i); renderExportParts(); toast('Parte ' + (i + 1) + ' lista'); }
  } catch (e) { if (pp) pp.textContent = 'No se pudo crear esta parte. Cierra otras apps y vuelve a intentarlo.'; }
}

/* ---------- Fotos de ejemplo ---------- */
async function makeSample() {
  const mk = (w, h, draw, type, q) => new Promise(r => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); c.toBlob(r, type, q); });
  const scene = (sky1, sky2, ground, sun) => (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, sky1); g.addColorStop(1, sky2); x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = sun; x.beginPath(); x.arc(w * .7, h * .32, h * .12, 0, 7); x.fill();
    x.fillStyle = ground; x.beginPath(); x.moveTo(0, h * .7); x.quadraticCurveTo(w * .3, h * .5, w * .6, h * .68); x.quadraticCurveTo(w * .85, h * .8, w, h * .62); x.lineTo(w, h); x.lineTo(0, h); x.fill();
  };
  const now = new Date(); const ago = (m, d) => new Date(now.getFullYear(), now.getMonth() - m, d, 12).getTime();
  const specs = [
    ['IMG_0412.jpg', scene('#ffb070', '#ffe2b8', '#4d6b3a', '#fff4d6'), ago(0, 3)],
    ['IMG_0413.jpg', scene('#ffb070', '#ffe2b8', '#4d6b3a', '#fff4d6'), ago(0, 3), .5],
    ['IMG_0398.jpg', scene('#3d7bd9', '#bfe0ff', '#c9a86a', '#ffffff'), ago(0, 3) + 3600e3],
    ['IMG_0350.jpg', scene('#21304f', '#5b6fa3', '#1b2235', '#f2f0d8'), ago(1, 20)],
    ['IMG_0351.jpg', scene('#7a4fbf', '#f2a6c9', '#2c3a52', '#ffe9f2'), ago(1, 12)],
    ['IMG_0302.jpg', scene('#2aa69a', '#d7f5ef', '#3a5f43', '#ffffff'), ago(2, 7)],
    ['IMG_0303.jpg', scene('#2aa69a', '#d7f5ef', '#3a5f43', '#ffffff'), ago(2, 7), .4],
  ];
  const files = [];
  for (const [n, d, t, q] of specs) files.push(new File([await mk(640, 480, d, 'image/jpeg', q || .85)], n, { type: 'image/jpeg', lastModified: t }));
  const shot = await mk(390, 844, (x, w, h) => { x.fillStyle = '#f4f4f7'; x.fillRect(0, 0, w, h); x.fillStyle = '#2f5bea'; x.fillRect(0, 0, w, 90); x.fillStyle = '#d8dbe5'; for (let i = 0; i < 7; i++) x.fillRect(20, 120 + i * 95, w - 40, 70); }, 'image/png');
  files.push(new File([shot], 'Captura 2.png', { type: 'image/png', lastModified: ago(1, 2) }));
  await addFiles(files, true);
  if (S.sample) {
    const cats = { '0412': 'Paisajes', '0413': 'Paisajes', '0398': 'Paisajes', '0350': 'Paisajes', '0351': 'Diseños', '0302': 'Comida', '0303': 'Comida' };
    S.photos.forEach(p => { const k = (p.name.match(/\d{4}/) || [])[0]; if (cats[k]) p.cat = cats[k]; if (/0412|0413|0398/.test(p.name)) p.gps = [-12.122, -77.03]; if (/0302|0303/.test(p.name)) p.gps = [-12.046, -77.043]; });
    computeAuto(); places.forEach((c, i) => S.placeNames[c.key] = i ? 'Ejemplo: Centro' : 'Ejemplo: Playa');
    addAlbum('Favoritas'); setAlbum(S.photos.filter(p => /0398/.test(p.name)).map(p => p.id), 'Favoritas'); render();
  }
}
render(); makeSample();
})();
</script>
