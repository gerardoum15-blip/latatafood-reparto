<style>

  --accent:#7d9bff; --accent-ink:#0e1220; --accent-soft:#232c4f;
  --del:#ff6b6b; --del-soft:#3d1d24; --keep:#4fd08f; --keep-soft:#173327; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#171c2e; --fg:#e8ebf5; --muted:#99a2bd; --line:#2a3149;

*{box-sizing:border-box}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}

.btn input{position:absolute;opacity:0;width:1px;height:1px}
.btn{position:relative;display:inline-flex;align-items:center}

.note{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.progress{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="wrap">
  <div class="top">
    <div>
      <h1>Ordena tus Fotos</h1>
      <p>Crea carpetas automáticas por tipo (paisajes, diseños, La Tata Food…), evento y lugar. También encuentra duplicados y capturas, y guarda todo ordenado.</p>
    </div>
    <div class="btns">
      <label class="btn primary" for="pick">Elegir fotos<input id="pick" type="file" accept="image/*" multiple></label>
      <label class="btn" for="pickDir" id="pickDirLbl" hidden>Elegir carpeta<input id="pickDir" type="file" webkitdirectory multiple></label>
      <button id="exportBtn">Exportar ordenadas</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="notice"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
</div>
<div class="bar" id="bar" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const S = { photos: [], tab: 'auto', sel: new Set(), albums: [], sample: true, busy: null, reviewUrl: null, exportBy: 'tipo', exclDel: true, lastReview: [] };
let nextId = 1;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const monthKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- EXIF (JPEG): fecha original y cámara ---------- */
function readExif(buf) {

      const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
      const str = (p, n) => { let s = ''; for (let i = 0; i < n && p + i < v.byteLength; i++) { const c = v.getUint8(p + i); if (!c) break; s += String.fromCharCode(c); } return s; };

          else if (type === 4) res[tag] = u32(e + 8);
          else if (type === 5) { const p = t + u32(e + 8), a = []; for (let k = 0; k < cnt && p + k * 8 + 8 <= v.byteLength; k++) { const d = u32(p + k * 8 + 4); a.push(d ? u32(p + k * 8) / d : 0); } res[tag] = a; }

      };

        if (i0[0x8769]) { const ex = ifd(t + i0[0x8769]); if (ex[0x9003]) out.date = ex[0x9003]; }
        if (i0[0x8825]) {

          if (lat !== null && lon !== null && (lat || lon)) { if (/S/i.test(g[1] || '')) lat = -lat; if (/W/i.test(g[3] || '')) lon = -lon; out.gps = [lat, lon]; }

function parseExifDate(s) {
  const m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(s || '');
  if (!m || m[1] === '0000') return null;
  const d = new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
  return isNaN(d) ? null : d;
}

/* ---------- Miniatura + huella visual (dHash 64 bits) ---------- */
function loadImg(url) { return new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; }); }
const pc = x => { x -= x >>> 1 & 0x55555555; x = (x & 0x33333333) + (x >>> 2 & 0x33333333); return ((x + (x >>> 4) & 0xF0F0F0F) * 0x1010101) >>> 24; };
async function analyze(file) {
  const p = { id: nextId++, file, name: file.name || ('foto-' + nextId + '.jpg'), size: file.size, type: file.type, del: false, album: null, reviewed: false };
  let ex = {};
  try { ex = readExif(await file.slice(0, 256 * 1024).arrayBuffer()); } catch (e) {}
  p.make = ex.make || ''; p.model = ex.model || ''; p.gps = ex.gps || null; p.cat = null;
  p.date = parseExifDate(ex.date) || new Date(file.lastModified || Date.now());
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    p.w = img.naturalWidth; p.h = img.naturalHeight;
    const sc = Math.min(1, 260 / Math.max(p.w, p.h));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(p.w * sc)); c.height = Math.max(1, Math.round(p.h * sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    p.thumbBlob = await new Promise(r => c.toBlob(r, 'image/jpeg', .72));
    p.thumb = URL.createObjectURL(p.thumbBlob);
    const h = document.createElement('canvas'); h.width = 9; h.height = 8;
    const hx = h.getContext('2d', { willReadFrequently: true }); hx.drawImage(img, 0, 0, 9, 8);
    const d = hx.getImageData(0, 0, 9, 8).data; const g = [];
    for (let i = 0; i < 72; i++) g.push(d[i * 4] * .299 + d[i * 4 + 1] * .587 + d[i * 4 + 2] * .114);
    let a = 0, b = 0, k = 0;
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++, k++) { const bit = g[y * 9 + x] > g[y * 9 + x + 1] ? 1 : 0; if (k < 32) a = (a << 1 | bit) >>> 0; else b = (b << 1 | bit) >>> 0; }
    p.hash = [a, b];
  } catch (e) { p.w = p.h = 0; p.thumb = ''; p.hash = null; }
  URL.revokeObjectURL(url);
  const ratio = p.w && p.h ? Math.max(p.w, p.h) / Math.min(p.w, p.h) : 0;
  const n = p.name.toLowerCase();
  p.screenshot = !p.make && (/screenshot|captura|screen shot/.test(n) || p.type === 'image/png' || (ratio > 2.0 && ratio < 2.3 && p.h > p.w));
  return p;
}

/* ---------- Duplicados y similares ---------- */
let dupGroups = [];
function computeDups() {
  const ps = S.photos.filter(p => p.hash); const parent = new Map(ps.map(p => [p.id, p.id]));
  const find = x => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
    const A = ps[i].hash, B = ps[j].hash;
    if (pc(A[0] ^ B[0]) + pc(A[1] ^ B[1]) <= 6) { const ra = find(ps[i].id), rb = find(ps[j].id); if (ra !== rb) parent.set(ra, rb); }
  }
  const m = new Map(); ps.forEach(p => { const r = find(p.id); if (!m.has(r)) m.set(r, []); m.get(r).push(p); });
  dupGroups = [...m.values()].filter(g => g.length > 1).map(g => g.sort((a, b) => (b.w * b.h - a.w * a.h) || (b.size - a.size)));
}

/* ---------- Carpetas automáticas: eventos, lugares y tipo ---------- */
const DEF_CATS = ['Paisajes', 'Comida', 'La Tata Food', 'Diseños', 'Personas y selfies', 'Mascotas', 'Documentos y recibos', 'Capturas de pantalla', 'Otros'];
const DEF_TATA = 'La Tata Food es mi negocio de comida: fotos de sus platos, el local, el logo, los pedidos, los tickets y la publicidad.';
const store = { get(k, d) { try { const v = localStorage.getItem('ordena:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('ordena:' + k, JSON.stringify(v)); } catch (e) {} } };
S.cats = store.get('cats', DEF_CATS); S.tata = store.get('tata', DEF_TATA);
S.autoView = 'tipo'; S.cls = null; S.expanded = new Set(); S.placeNames = {};
let events = [], places = [];
const shortDay = new Intl.DateTimeFormat('es', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const km = (a, b) => { const r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r; const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };
function computeAuto() {
  places = [];
  S.photos.forEach(p => {
    p.place = null; if (!p.gps) return;
    let c = places.find(c => km(c.center, p.gps) < 3);
    if (!c) { c = { id: places.length, center: p.gps.slice(), photos: [] }; places.push(c); }
    c.photos.push(p); p.place = c.id;
    c.center = [c.photos.reduce((s, q) => s + q.gps[0], 0) / c.photos.length, c.photos.reduce((s, q) => s + q.gps[1], 0) / c.photos.length];
  });
  places.forEach(c => c.key = c.center[0].toFixed(2) + ',' + c.center[1].toFixed(2));
  events = [];
  const asc = S.photos.slice().sort((a, b) => a.date - b.date);
  let cur = null;
  asc.forEach(p => { if (!cur || p.date - cur.last > 4 * 3600e3) { cur = { id: events.length, photos: [], start: p.date, last: p.date }; events.push(cur); } cur.photos.push(p); cur.last = p.date; p.event = cur.id; });
  S.photos.forEach(p => { if (!p.cat && p.screenshot && S.cats.includes('Capturas de pantalla')) p.cat = 'Capturas de pantalla'; });
}
const placeName = id => { const c = places[id]; return c ? (S.placeNames[c.key] || 'Lugar ' + (id + 1)) : 'Sin ubicación'; };
function eventName(id) {
  const e = events[id]; if (!e) return 'Sin evento';
  let n = cap(shortDay.format(e.start));
  const pl = e.photos.find(p => p.place !== null); if (pl) n += ' · ' + placeName(pl.place);
  const cnt = {}; e.photos.forEach(p => { if (p.cat && p.cat !== 'Otros') cnt[p.cat] = (cnt[p.cat] || 0) + 1; });
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]; if (top) n += ' · ' + top[0];
  return n;
}
function autoFolders(view) {
  const m = new Map(), add = (k, p) => { if (!m.has(k)) m.set(k, []); m.get(k).push(p); };
  if (view === 'tipo') { S.photos.forEach(p => add(p.cat || 'Sin clasificar', p)); const order = [...S.cats, 'Sin clasificar']; return [...m.entries()].sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0])); }
  if (view === 'lugar') { S.photos.forEach(p => add(placeName(p.place), p)); return [...m.entries()].sort((a, b) => (a[0] === 'Sin ubicación') - (b[0] === 'Sin ubicación') || b[1].length - a[1].length); }
  const big = events.filter(e => e.photos.length >= 3).reverse();
  const out = big.map(e => [eventName(e.id), e.photos.slice().sort((a, b) => b.date - a.date)]);
  const loose = events.filter(e => e.photos.length < 3).flatMap(e => e.photos);
  if (loose.length) out.push(['Fotos sueltas', loose]);
  return out;
}
async function getSample() { try { return window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { return null; } }
function clsError(e) {
  const c = e && e.code;
  if (c === 'cancelled') return null;
  if (c === 'not_granted') return 'No se dio permiso para usar Claude. Las carpetas por evento y lugar siguen funcionando.';
  if (c === 'rate_limited') return 'Claude pidió una pausa. Espera un minuto y toca «Continuar».';
  return 'Se detuvo la clasificación (' + (c || 'error') + '). Toca «Continuar» para seguir.';
}
async function namePlaces(sample) {
  const todo = places.filter(c => !S.placeNames[c.key]).slice(0, 60); if (!todo.length) return;
  try {
    const r = await sample.json('Para cada coordenada GPS (latitud, longitud) escribe el nombre corto del lugar en español: barrio o distrito y ciudad, o el lugar conocido más cercano (máximo 4 palabras). Responde solo con un arreglo JSON: [{"k":"<la clave>","n":"<nombre>"}].\n' + todo.map(c => c.key).join('\n'), { modelTier: 'quick', cache: { gcTime: 86400000 } });
    (Array.isArray(r) ? r : []).forEach(o => { if (o && o.k && o.n && todo.some(c => c.key === o.k)) S.placeNames[o.k] = String(o.n).slice(0, 40).replace(/[\\/:*?"<>|]/g, '-'); });
  } catch (e) {}
}
async function autoRun() {
  if (S.cls && S.cls.running) return;
  if (!S.cats.includes('Otros')) S.cats.push('Otros');
  computeAuto();
  const todo = S.photos.filter(p => !p.cat && p.thumbBlob);
  S.cls = { running: true, done: 0, total: todo.length, ctrl: new AbortController(), error: null };
  render();
  const sample = await getSample();
  if (!sample) { S.cls = { error: 'Eventos y lugares ya están listos. La clasificación por tipo (paisajes, diseños, La Tata Food…) funciona cuando abres esta app dentro de Claude.' }; render(); return; }
  let caps = null; try { caps = await sample.limits(); } catch (e) {}
  if (places.length) await namePlaces(sample);
  if (!caps || !caps.images) { S.cls = { error: 'En esta vista no se pueden enviar imágenes a Claude, así que la clasificación por tipo no está disponible.' }; render(); return; }
  const per = Math.max(1, Math.min(caps.images.maxCount || 1, 10));
  const cats = S.cats.slice();
  for (let i = 0; i < todo.length && S.cls.running; i += per) {
    const batch = todo.slice(i, i + per);
    const prompt = `Te envío ${batch.length} miniaturas de fotos de la galería del iPhone de una persona, en orden (de la 1 a la ${batch.length}). Pon cada foto en UNA sola de estas carpetas: ${cats.map(c => '"' + c + '"').join(', ')}.\n` +
      (S.tata ? `Contexto que dio la persona: ${S.tata}\n` : '') +
      `"Diseños" son imágenes hechas en computadora o celular: logos, afiches, flyers, menús, artes para redes sociales. Si ninguna carpeta encaja, usa "Otros".\nResponde solo con un arreglo JSON, sin texto extra: [{"i":1,"c":"<carpeta>"}]`;
    try {
      const r = await sample.json(prompt, { images: batch.map(p => p.thumbBlob), modelTier: 'quick', signal: S.cls.ctrl.signal });
      (Array.isArray(r) ? r : []).forEach(o => { const p = batch[(+(o && o.i)) - 1]; if (p) p.cat = cats.includes(o.c) ? o.c : 'Otros'; });
    } catch (e) { S.cls.error = clsError(e); break; }
    S.cls.done += batch.length;
    if (S.tab === 'auto') renderView(); renderTabs();
  }
  S.cls.running = false; render();
  if (!S.cls.error && S.cls.total) toast('Fotos ordenadas en carpetas');
}

/* ---------- Cargar fotos ---------- */
async function addFiles(files, isSample) {
  files = [...files].filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|gif|webp)$/i.test(f.name));
  if (!files.length) return;
  if (!isSample && S.sample) { S.photos.forEach(p => p.thumb && URL.revokeObjectURL(p.thumb)); S.photos = []; S.albums = []; S.sel.clear(); S.sample = false; S.placeNames = {}; S.cls = null; }
  S.busy = { done: 0, total: files.length }; renderNotice();
  const queue = files.slice(); const out = [];
  const worker = async () => { while (queue.length) { const f = queue.shift(); out.push(await analyze(f)); S.busy.done++; if (S.busy.done % 4 === 0) renderNotice(); } };
  await Promise.all([worker(), worker(), worker()]);
  S.photos.push(...out); S.photos.sort((a, b) => b.date - a.date);
  S.busy = null; computeDups(); computeAuto(); render();
  if (!isSample) toast(out.length + ' fotos cargadas');
}

function addAlbum(name) { name = name.trim().replace(/[\\/:*?"<>|]/g, '-'); if (!name) return null; if (!S.albums.includes(name)) S.albums.push(name); return name; }

  if (window.claude && window.claude.use) {
    const d = await window.claude.use('downloads');
    if (d) { try { await d.save({ filename: name, data: blob }); return true; } catch (e) { if (e && e.code === 'declined') return false; toast('No se pudo guardar: ' + (e && e.message || 'error')); return false; } }
  }
  const f = new File([blob], name, { type: blob.type || 'application/zip' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); return true; } catch (e) { if (e.name === 'AbortError') return false; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); return true;
}
async function doExport() {
  if (!window.JSZip) { toast('No se pudo cargar el compresor. Revisa tu conexión.'); return; }
  const list = S.photos.filter(p => !(S.exclDel && p.del));
  if (!list.length) { toast('No hay fotos para exportar'); return; }
  const zip = new JSZip(); const used = new Set();
  list.forEach(p => {
    const by = S.exportBy, month = `${monthKey(p.date)} ${monthLabel(p.date)}`;
    const raw = by === 'album' ? p.album : by === 'tipo' ? (p.cat || 'Sin clasificar') : by === 'evento' ? (events[p.event] && events[p.event].photos.length >= 3 ? eventName(p.event) : 'Fotos sueltas') : by === 'lugar' ? placeName(p.place) : null;
    const folder = (raw || month).replace(/[\\/:*?"<>|]/g, '-');
    let n = p.name.replace(/[\\/:*?"<>|]/g, '-'), path = folder + '/' + n, k = 2;
    while (used.has(path.toLowerCase())) { path = folder + '/' + n.replace(/(\.[^.]*)?$/, m => '-' + k + m); k++; }
    used.add(path.toLowerCase());
    zip.file(path, p.file, { date: p.date, binary: true });
  });
  const prog = $('#expProg');
  try {
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' }, m => { prog.textContent = 'Preparando… ' + Math.round(m.percent) + '%'; });
    prog.textContent = `Listo: ${list.length} fotos, ${fmtSize(blob.size)}.`;
    const ok = await offerFile('Fotos ordenadas.zip', blob);
    if (ok) toast('Archivo listo');
  } catch (e) { prog.textContent = 'No se pudo crear el archivo. Prueba exportando menos fotos a la vez.'; }
}

/* ---------- Fotos de ejemplo ---------- */
async function makeSample() {
  const mk = (w, h, draw, type, q) => new Promise(r => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); c.toBlob(r, type, q); });
  const scene = (sky1, sky2, ground, sun) => (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, sky1); g.addColorStop(1, sky2); x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = sun; x.beginPath(); x.arc(w * .7, h * .32, h * .12, 0, 7); x.fill();
    x.fillStyle = ground; x.beginPath(); x.moveTo(0, h * .7); x.quadraticCurveTo(w * .3, h * .5, w * .6, h * .68); x.quadraticCurveTo(w * .85, h * .8, w, h * .62); x.lineTo(w, h); x.lineTo(0, h); x.fill();
  };
  const now = new Date(); const ago = (m, d) => new Date(now.getFullYear(), now.getMonth() - m, d, 12).getTime();
  const specs = [
    ['IMG_0412.jpg', scene('#ffb070', '#ffe2b8', '#4d6b3a', '#fff4d6'), ago(0, 3)],
    ['IMG_0413.jpg', scene('#ffb070', '#ffe2b8', '#4d6b3a', '#fff4d6'), ago(0, 3), .5],
    ['IMG_0398.jpg', scene('#3d7bd9', '#bfe0ff', '#c9a86a', '#ffffff'), ago(0, 3) + 3600e3],
    ['IMG_0350.jpg', scene('#21304f', '#5b6fa3', '#1b2235', '#f2f0d8'), ago(1, 20)],
    ['IMG_0351.jpg', scene('#7a4fbf', '#f2a6c9', '#2c3a52', '#ffe9f2'), ago(1, 12)],
    ['IMG_0302.jpg', scene('#2aa69a', '#d7f5ef', '#3a5f43', '#ffffff'), ago(2, 7)],
    ['IMG_0303.jpg', scene('#2aa69a', '#d7f5ef', '#3a5f43', '#ffffff'), ago(2, 7), .4],
  ];
  const files = [];
  for (const [n, d, t, q] of specs) files.push(new File([await mk(640, 480, d, 'image/jpeg', q || .85)], n, { type: 'image/jpeg', lastModified: t }));
  const shot = await mk(390, 844, (x, w, h) => { x.fillStyle = '#f4f4f7'; x.fillRect(0, 0, w, h); x.fillStyle = '#2f5bea'; x.fillRect(0, 0, w, 90); x.fillStyle = '#d8dbe5'; for (let i = 0; i < 7; i++) x.fillRect(20, 120 + i * 95, w - 40, 70); }, 'image/png');
  files.push(new File([shot], 'Captura 2.png', { type: 'image/png', lastModified: ago(1, 2) }));
  await addFiles(files, true);
  if (S.sample) {
    const cats = { '0412': 'Paisajes', '0413': 'Paisajes', '0398': 'Paisajes', '0350': 'Paisajes', '0351': 'Diseños', '0302': 'Comida', '0303': 'Comida' };
    S.photos.forEach(p => { const k = (p.name.match(/\d{4}/) || [])[0]; if (cats[k]) p.cat = cats[k]; if (/0412|0413|0398/.test(p.name)) p.gps = [-12.122, -77.03]; if (/0302|0303/.test(p.name)) p.gps = [-12.046, -77.043]; });
    computeAuto(); places.forEach((c, i) => S.placeNames[c.key] = i ? 'Ejemplo: Centro' : 'Ejemplo: Playa');
    addAlbum('Favoritas'); setAlbum(S.photos.filter(p => /0398/.test(p.name)).map(p => p.id), 'Favoritas'); render();
  }
}
render(); makeSample();
